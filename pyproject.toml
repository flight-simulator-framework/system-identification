[project]
name = "flight-system-identification"
version = "0.1.0"
description = "Machine excitation and acquisition for corrector and quadrupole-mover system identification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "machine-interfaces[epics,madx,rftrack,tao] @ git+https://gitlab.cern.ch/flight-simulator/machine-interfaces.git@1fa7fca06f949e085353030f59587a68de7e3baf"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "system_identification"}, {include = "SysID_GUI.py"}, {include = "SysID_QM_GUI.py"}]

[tool.flight-simulator.migration]
status = "sysid-local-execution-ready"
repository-dependencies = ["machine-interfaces"]
